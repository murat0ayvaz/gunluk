      # Hava durumu için konum izni (telefonun konumunu kullan seçeneği)
      - name: Android ayarları (konum)
        run: |
          python3 - <<'PY'
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          if 'ACCESS_COARSE_LOCATION' not in s:
              perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in
                  ['ACCESS_COARSE_LOCATION', 'ACCESS_FINE_LOCATION'])
              s = s.replace('<application', perms + '    <application', 1)
          open(m, 'w', encoding='utf-8').write(s)
          PY
          grep -n "ACCESS_" android/app/src/main/AndroidManifest.xml

      # Haber: sesli okuma (TTS) ve bağlantı açma için Android 11+ paket görünürlüğü
      - name: Android ayarları (haber)
        run: |
          python3 - <<'PY'
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          add = ''
          if 'android.intent.action.TTS_SERVICE' not in s:
              add += '        <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>\n'
          if 'android.intent.action.VIEW' not in s:
              add += '        <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>\n'
          if add:
              if '</queries>' in s:
                  s = s.replace('</queries>', add + '    </queries>', 1)
              else:
                  s = s.replace('<application', '    <queries>\n' + add + '    </queries>\n    <application', 1)
          open(m, 'w', encoding='utf-8').write(s)
          PY
          grep -n "queries\|TTS_SERVICE" android/app/src/main/AndroidManifest.xml

      # Ses kaydı: mikrofon izni ve minimum Android sürümü (kayıt eklentisi en az 23 ister)
      - name: Android ayarları (ses kaydı)
        run: |
          python3 - <<'PY'
          import re, os
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          if 'RECORD_AUDIO' not in s:
              s = s.replace('<application', '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application', 1)
          open(m, 'w', encoding='utf-8').write(s)
          for g in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if not os.path.exists(g):
                  continue
              t = open(g, encoding='utf-8').read()
              t2 = re.sub(r'minSdk(Version)?\s*=?\s*flutter\.minSdkVersion', lambda mo: 'minSdk' + ('Version' if mo.group(1) else '') + (' = 24' if '=' in mo.group(0) else ' 24'), t)
              if t2 != t:
                  open(g, 'w', encoding='utf-8').write(t2)
              break
          PY
          grep -n "minSdk\|RECORD_AUDIO" android/app/build.gradle* android/app/src/main/AndroidManifest.xml

      # Vosk (JNA) R8 kod küçültmesinde bozuluyordu: "Can't obtain peer field ID for class com.sun.jna.Pointer".
      # JNA ve Vosk sınıfları korunur (proguard-rules.pro) ve release derlemesine bağlanır.
      - name: Android ayarları (Vosk koruma kuralları)
        run: |
          cat > android/app/proguard-rules.pro <<'EOF'
          -keep class com.sun.jna.** { *; }
          -keepclassmembers class * extends com.sun.jna.* { public *; }
          -keep class org.vosk.** { *; }
          -keep class com.ryanheise.** { *; }
          -keep class androidx.media.** { *; }
          -keep class com.google.android.exoplayer2.** { *; }
          -dontwarn java.awt.**
          -dontwarn com.sun.jna.**
          EOF
          # Bildirim düğmeleri: köşeleri yuvarlatılmış simgeler (yuvarlak birleşimli kenarlık)
          mkdir -p android/app/src/main/res/drawable-anydpi-v21
          cat > android/app/src/main/res/drawable-anydpi-v21/audio_service_play_arrow.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.4" android:strokeLineJoin="round" android:strokeLineCap="round" android:pathData="M8,5 L19,12 L8,19 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable-anydpi-v21/audio_service_pause.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.4" android:strokeLineJoin="round" android:strokeLineCap="round" android:pathData="M7,5 L10.5,5 L10.5,19 L7,19 Z M13.5,5 L17,5 L17,19 L13.5,19 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable-anydpi-v21/audio_service_stop.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.4" android:strokeLineJoin="round" android:strokeLineCap="round" android:pathData="M7,7 L17,7 L17,17 L7,17 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable-anydpi-v21/audio_service_skip_next.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.4" android:strokeLineJoin="round" android:strokeLineCap="round" android:pathData="M6,6 L15,12 L6,18 Z M17,6 L19,6 L19,18 L17,18 Z"/>
          </vector>
          EOF
          cat > android/app/src/main/res/drawable-anydpi-v21/audio_service_skip_previous.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFFFF" android:strokeColor="#FFFFFFFF" android:strokeWidth="2.4" android:strokeLineJoin="round" android:strokeLineCap="round" android:pathData="M18,6 L9,12 L18,18 Z M5,6 L7,6 L7,18 L5,18 Z"/>
          </vector>
          EOF
          python3 - <<'PY'
          import os, re
          done = False
          for g in ('android/app/build.gradle.kts', 'android/app/build.gradle'):
              if not os.path.exists(g):
                  continue
              t = open(g, encoding='utf-8').read()
              if 'proguard-rules.pro' in t:
                  print('proguard zaten bagli:', g)
                  done = True
                  break
              if g.endswith('.kts'):
                  line = '\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")'
                  t2 = re.sub(r'(buildTypes\s*\{\s*(?:getByName\("release"\)|release)\s*\{)', lambda m: m.group(1) + line, t, count=1)
              else:
                  line = "\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
                  t2 = re.sub(r'(buildTypes\s*\{\s*release\s*\{)', lambda m: m.group(1) + line, t, count=1)
              if t2 != t:
                  open(g, 'w', encoding='utf-8').write(t2)
                  print('proguard baglandi:', g)
                  done = True
              break
          if not done:
              print('UYARI: release blogu bulunamadi, proguard baglanamadi')
          PY
          grep -n "proguard" android/app/build.gradle* || true

      # Sesli komut: telefonun ses tanıma servisini görebilmek için (Android 11+ paket görünürlüğü)
      - name: Android ayarları (sesli komut)
        run: |
          python3 - <<'PY'
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          if 'RECORD_AUDIO' not in s:
              s = s.replace('<application', '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application', 1)
          # vosk_flutter_2 kendini minSdk 30 ilan ediyor; uygulama minSdk 24 kalsın diye zorla kullan
          if 'overrideLibrary' not in s:
              s = s.replace('<application', '    <uses-sdk tools:overrideLibrary="org.vosk.vosk_flutter"/>\n    <application', 1)
          if 'android.speech.RecognitionService' not in s:
              add = '        <intent><action android:name="android.speech.RecognitionService"/></intent>\n'
              if '</queries>' in s:
                  s = s.replace('</queries>', add + '    </queries>', 1)
              else:
                  s = s.replace('<application', '    <queries>\n' + add + '    </queries>\n    <application', 1)
          open(m, 'w', encoding='utf-8').write(s)
          PY
          grep -n "RecognitionService\|RECORD_AUDIO" android/app/src/main/AndroidManifest.xml

      # Her derlemede AYNI imza anahtarı kullanılsın: yeni APK eskisinin üstüne kurulsun.
      # debug.keystore yoksa derleme bilerek hata verir.
      - name: Sabit imza anahtarı
        run: |
          if [ ! -f debug.keystore ]; then
            echo "HATA: debug.keystore reponun ana klasorunde yok."
            exit 1
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "Anahtar kopyalandi."

      - run: flutter pub get

      # Eski eklentilerde android/build.gradle'da "namespace" yok; yeni Gradle bunu reddeder.
      # Eksik olanlara AndroidManifest'teki package adı namespace olarak eklenir.
      - name: Eklenti namespace yamasi
        run: |
          python3 - <<'PY'
          import glob, os, re
          for g in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/*/android/build.gradle')):
              t = open(g).read()
              if re.search(r'^\s*namespace\b', t, re.M):
                  continue
              d = os.path.dirname(g)
              pkg = None
              mf = os.path.join(d, 'src', 'main', 'AndroidManifest.xml')
              if os.path.exists(mf):
                  m = re.search(r'package\s*=\s*"([^"]+)"', open(mf).read())
                  if m:
                      pkg = m.group(1)
              if not pkg:
                  pkg = 'plugin.' + os.path.basename(os.path.dirname(d)).split('-')[0]
              t2 = re.sub(r'android\s*\{', "android {\n    namespace '" + pkg + "'", t, count=1)
              open(g, 'w').write(t2)
              print('namespace eklendi:', g, pkg)
          # vosk_flutter_2 kutuphanesi minSdk 30 ilan ediyor; 24'e indir (manifest birlesme hatasi olmasin)
          for g in glob.glob(os.path.expanduser('~/.pub-cache/hosted/pub.dev/vosk_flutter_2-*/android/build.gradle')):
              t = open(g).read()
              t2 = re.sub(r'(minSdk(?:Version)?\s*=?\s*)(\d+)', lambda m: m.group(1) + '24' if int(m.group(2)) > 24 else m.group(0), t)
              # kutuphane android-33 ile derleniyor ama bagimliliklari 34+ istiyor: compileSdk 34 yap
              t2 = re.sub(r'(compileSdk(?:Version)?\s*=?\s*)(\d+)', lambda m: m.group(1) + '34' if int(m.group(2)) < 34 else m.group(0), t2)
              if t2 != t:
                  open(g, 'w').write(t2)
                  print('vosk minSdk 24 yapildi:', g)
              else:
                  print('vosk minSdk satiri degismedi:', g)
                  print(t)
          PY

      # Uygulama simgesini üret (hata verirse derleme yine de devam eder)
      - name: Uygulama simgesi
        continue-on-error: true
        run: dart run flutter_launcher_icons

      # Android lint aracı bazı eklentilerde (url_launcher) çöküyor; kod hatası değil, lint'i kapat
      - name: Lint kapat
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lint')) { t.enabled = false }
            }
          }
          GRADLE
          cat ~/.gradle/init.d/nolint.gradle

      # --no-shrink: Android kod küçültmesi (R8) kapalı
      - run: flutter build apk --release --no-shrink

      # Bu satir her derlemede AYNI olmali (SHA-256)
      - name: Imza parmak izi
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: gunluk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
