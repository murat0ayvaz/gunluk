name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # Actions sekmesinden elle de başlatılabilir

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ klasörünü otomatik üretir (repoda tutmaya gerek yok)
      - name: Android klasörünü oluştur
        run: flutter create --platforms=android --project-name gunluk .

      # Telefondaki uygulama adını "Daily Routine" yap
      - name: Uygulama adı
        run: sed -i 's/android:label="[^"]*"/android:label="Daily Routine"/' android/app/src/main/AndroidManifest.xml

      # Her derlemede AYNI imza anahtarı kullanılsın: yeni APK eskisinin üstüne kurulsun.
      # debug.keystore yoksa derleme bilerek hata verir.
      - name: Sabit imza anahtarı
        run: |
          if [ ! -f debug.keystore ]; then
            echo "HATA: debug.keystore reponun ana klasorunde yok."
            exit 1
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          echo "Anahtar kopyalandi."

      - run: flutter pub get
      # --no-shrink: Android kod küçültmesi (R8) kapalı
      - run: flutter build apk --release --no-shrink

      # Bu satir her derlemede AYNI olmali (SHA-256)
      - name: Imza parmak izi
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep "SHA-256" || true

      - uses: actions/upload-artifact@v4
        with:
          name: gunluk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
