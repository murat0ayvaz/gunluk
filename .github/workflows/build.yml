name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # Actions sekmesinden elle de başlatılabilir

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ klasörünü otomatik üretir (repoda tutmaya gerek yok)
      - name: Android klasörünü oluştur
        run: flutter create --platforms=android --project-name gunluk .

      # Telefondaki uygulama adını "Daily Routine" yap
      - name: Uygulama adı
        run: sed -i 's/android:label="[^"]*"/android:label="Daily Routine"/' android/app/src/main/AndroidManifest.xml

      # Bildirimler için Android ayarları (izinler, alıcılar, desugaring)
      - name: Android ayarları (bildirimler)
        run: |
          python3 - <<'PY'
          import re, os
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          if 'SCHEDULE_EXACT_ALARM' not in s:
              perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in
                  ['POST_NOTIFICATIONS', 'SCHEDULE_EXACT_ALARM', 'RECEIVE_BOOT_COMPLETED', 'VIBRATE'])
              s = s.replace('<application', perms + '    <application', 1)
          if 'ScheduledNotificationReceiver' not in s:
              rec = (
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />\n'
                  '        <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.BOOT_COMPLETED"/>\n'
                  '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>\n'
                  '                <action android:name="android.intent.action.QUICKBOOT_POWERON"/>\n'
                  '                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n')
              s = s.replace('</application>', rec + '    </application>', 1)
          open(m, 'w', encoding='utf-8').write(s)
          for g, kts in (('android/app/build.gradle.kts', True), ('android/app/build.gradle', False)):
              if not os.path.exists(g):
                  continue
              t = open(g, encoding='utf-8').read()
              if 'desugar_jdk_libs' in t:
                  break
              if kts:
                  t = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', t, count=1)
                  t += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
              else:
                  t = re.sub(r'compileOptions\s*\{', 'compileOptions {\n        coreLibraryDesugaringEnabled true', t, count=1)
                  t += "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
              open(g, 'w', encoding='utf-8').write(t)
              break
          PY
          grep -n "desugar" android/app/build.gradle* || echo "UYARI: desugar eklenemedi"

      # Müzik / radyo için Android ayarları (internet, arka planda çalma)
      - name: Android ayarları (müzik)
        run: |
          python3 - <<'PY'
          import os
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s:
              perms = ''.join('    <uses-permission android:name="android.permission.%s"/>\n' % x for x in
                  ['INTERNET', 'WAKE_LOCK', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_MEDIA_PLAYBACK'])
              s = s.replace('<application', perms + '    <application', 1)
          if 'usesCleartextTraffic' not in s:
              s = s.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          if 'com.ryanheise.audioservice.AudioService' not in s:
              svc = (
                  '        <service android:name="com.ryanheise.audioservice.AudioService" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.media.browse.MediaBrowserService" />\n'
                  '            </intent-filter>\n'
                  '        </service>\n'
                  '        <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true" tools:ignore="Instantiatable">\n'
                  '            <intent-filter>\n'
                  '                <action android:name="android.intent.action.MEDIA_BUTTON" />\n'
                  '            </intent-filter>\n'
                  '        </receiver>\n')
              s = s.replace('</application>', svc + '    </application>', 1)
          open(m, 'w', encoding='utf-8').write(s)
          done = False
          for root, _, files in os.walk('android/app/src/main'):
              for fn in files:
                  if fn == 'MainActivity.kt':
                      p = os.path.join(root, fn)
                      t = open(p, encoding='utf-8').read()
                      if 'AudioServiceActivity' not in t:
                          t = t.replace('import io.flutter.embedding.android.FlutterActivity', 'import com.ryanheise.audioservice.AudioServiceActivity')
                          t = t.replace('FlutterActivity()', 'AudioServiceActivity()')
                          open(p, 'w', encoding='utf-8').write(t)
                      done = True
                      print(p)
                      print(t)
          if not done:
              print('UYARI: MainActivity.kt bulunamadi')
          PY
          grep -n "audioservice\|INTERNET\|Cleartext" android/app/src/main/AndroidManifest.xml

      # Kısayollar: telefondaki uygulamaları listeleme ve başlatma (MainActivity kanalı)
      - name: Android ayarları (kısayollar)
        run: |
          python3 - <<'PY'
          import os, re
          m = 'android/app/src/main/AndroidManifest.xml'
          s = open(m, encoding='utf-8').read()
          intent = '        <intent><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent>\n'
          if 'android.intent.category.LAUNCHER"/></intent>' not in s:
              if '</queries>' in s:
                  s = s.replace('</queries>', intent + '    </queries>', 1)
              else:
                  s = s.replace('<application', '    <queries>\n' + intent + '    </queries>\n    <application', 1)
          open(m, 'w', encoding='utf-8').write(s)
          found = False
          for root, _, files in os.walk('android/app/src/main'):
              for fn in files:
                  if fn == 'MainActivity.kt':
                      p = os.path.join(root, fn)
                      t = open(p, encoding='utf-8').read()
                      pk = re.search(r'^package\s+([\w.]+)', t, re.M).group(1)
                      kt = (
                          'package ' + pk + '\n\n'
                          'import android.content.ContentValues\n'
                          'import android.graphics.Bitmap\n'
                          'import android.graphics.Canvas\n'
                          'import java.io.ByteArrayOutputStream\n'
                          'import android.content.Intent\n'
                          'import android.os.Build\n'
                          'import android.provider.MediaStore\n'
                          'import com.ryanheise.audioservice.AudioServiceActivity\n'
                          'import io.flutter.embedding.engine.FlutterEngine\n'
                          'import io.flutter.plugin.common.MethodChannel\n\n'
                          'class MainActivity : AudioServiceActivity() {\n'
                          '    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n'
                          '        super.configureFlutterEngine(flutterEngine)\n'
                          '        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "gunluk/apps").setMethodCallHandler { call, result ->\n'
                          '            when (call.method) {\n'
                          '                "list" -> {\n'
                          '                    val out = ArrayList<Map<String, String>>()\n'
                          '                    try {\n'
                          '                        val pm = packageManager\n'
                          '                        val i = Intent(Intent.ACTION_MAIN)\n'
                          '                        i.addCategory(Intent.CATEGORY_LAUNCHER)\n'
                          '                        val seen = HashSet<String>()\n'
                          '                        for (ri in pm.queryIntentActivities(i, 0)) {\n'
                          '                            val pkg = ri.activityInfo.packageName\n'
                          '                            if (pkg == packageName || !seen.add(pkg)) continue\n'
                          '                            out.add(mapOf("name" to ri.loadLabel(pm).toString(), "pkg" to pkg))\n'
                          '                        }\n'
                          '                    } catch (e: Exception) {\n'
                          '                    }\n'
                          '                    result.success(out)\n'
                          '                }\n'
                          '                "launch" -> {\n'
                          '                    val pkg = call.argument<String>("pkg")\n'
                          '                    val li = if (pkg == null) null else packageManager.getLaunchIntentForPackage(pkg)\n'
                          '                    if (li != null) {\n'
                          '                        li.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n'
                          '                        startActivity(li)\n'
                          '                        result.success(true)\n'
                          '                    } else {\n'
                          '                        result.success(false)\n'
                          '                    }\n'
                          '                }\n'
                          '                "saveDownload" -> {\n'
                          '                    val name = call.argument<String>("name")\n'
                          '                    val bytes = call.argument<ByteArray>("bytes")\n'
                          '                    var ok = false\n'
                          '                    try {\n'
                          '                        if (name != null && bytes != null && Build.VERSION.SDK_INT >= 29) {\n'
                          '                            val values = ContentValues()\n'
                          '                            values.put(MediaStore.Downloads.DISPLAY_NAME, name)\n'
                          '                            values.put(MediaStore.Downloads.MIME_TYPE, "application/octet-stream")\n'
                          '                            values.put(MediaStore.Downloads.RELATIVE_PATH, "Download/GunlukYedek")\n'
                          '                            val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, values)\n'
                          '                            if (uri != null) {\n'
                          '                                val os = contentResolver.openOutputStream(uri)\n'
                          '                                if (os != null) {\n'
                          '                                    os.write(bytes)\n'
                          '                                    os.close()\n'
                          '                                    ok = true\n'
                          '                                }\n'
                          '                            }\n'
                          '                        }\n'
                          '                    } catch (e: Exception) {\n'
                          '                    }\n'
                          '                    result.success(ok)\n'
                          '                }\n'
                          '                "icon" -> {\n'
                          '                    val pkg = call.argument<String>("pkg")\n'
                          '                    var out: ByteArray? = null\n'
                          '                    try {\n'
                          '                        if (pkg != null) {\n'
                          '                            val d = packageManager.getApplicationIcon(pkg)\n'
                          '                            val bmp = Bitmap.createBitmap(96, 96, Bitmap.Config.ARGB_8888)\n'
                          '                            val cv = Canvas(bmp)\n'
                          '                            d.setBounds(0, 0, 96, 96)\n'
                          '                            d.draw(cv)\n'
                          '                            val bo = ByteArrayOutputStream()\n'
                          '                            bmp.compress(Bitmap.CompressFormat.PNG, 100, bo)\n'
                          '                            out = bo.toByteArray()\n'
                          '                        }\n'
                          '                    } catch (e: Exception) {\n'
                          '                    }\n'
                          '                    result.success(out)\n'
                          '                }\n'
                          '                else -> result.notImplemented()\n'
                          '            }\n'
                          '        }\n'
                          '    }\n'
                          '}\n')
                      open(p, 'w', encoding='utf-8').write(kt)
                      found = True
                      print(kt)
          if not found:
              print('UYARI: MainActivity.kt bulunamadi')
          PY
          grep -n "LAUNCHER" android/app/src/main/AndroidManifest.xml

