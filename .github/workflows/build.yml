name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android klasörünü oluştur
        run: flutter create --platforms=android --project-name gunluk .

      - name: Uygulama adı
        run: sed -i 's/android:label="[^"]*"/android:label="Günlük"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: gunluk-apk
          path: build/app/outputs/flutter-apk/app-release.apk
